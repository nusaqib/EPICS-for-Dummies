site_name: EPICS for Dummies
site_description: A beginner-to-competent guide to the EPICS control system ecosystem — every tool, what it does, where to get it, and how a real facility puts it together.
site_url: https://nusaqib.github.io/EPICS-for-Dummies/
repo_url: https://github.com/nusaqib/EPICS-for-Dummies
repo_name: nusaqib/EPICS-for-Dummies
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  # Stamps each page with the date of its last commit, so a reader can see how
  # current it is. The failure mode for a guide like this is silent staleness.
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true

# Folder-level READMEs exist so directories are browsable on GitHub. The site
# uses index.md for section landing pages, and mkdocs warns (fatally, under
# --strict) if both live in one directory — so keep READMEs out of the build.
exclude_docs: |
  README.md

