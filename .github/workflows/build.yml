name: Build docs

# Validates the site on every pull request and every push. This is the job that
# catches broken internal links, anchors pointing at headings that no longer
# exist, and nav entries naming files that were deleted or renamed.
#
# It runs with --strict, so warnings fail the build. Deployment (docs.yml) is
# deliberately NOT strict: a warning should block a merge, not block publishing
# a site that is otherwise fine.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the git-revision-date-localized plugin reads commit
          # dates to stamp each page.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdocs build --strict
