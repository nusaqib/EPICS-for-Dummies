name: Deploy docs

# Publishes to GitHub Pages. Validation lives in build.yml, which runs with
# --strict on the same commit; this job stays non-strict so that a cosmetic
# warning cannot block publishing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the git-revision-date-localized plugin reads commit
          # dates to stamp each page.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
      - run: pip install -r requirements.txt
      - run: mkdocs gh-deploy --force
